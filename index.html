    ];
    const cs = { name: 'CONFIGURACIÓN', header: ['Clave', 'Valor'], types: ['txt', 's'], widths: [22, 90], rows: cfgRows };
    return { sheets: [gs, is, hs, ms, mts, mps, cps, ins, cs], counts: { grupos: grupos.length, items: items.length, historial: hist.length, fechas: dates.length, metasPers: cgl.length } };
  },

  async nextName() {
    const date = U.dateKey();
    const c = (await Meta.get('exportCounter')) || {};
    const n = c.date === date ? c.n + 1 : 1;
    await Meta.set('exportCounter', { date, n });
    return `Backup_Inventario_${date}${n > 1 ? '_' + n : ''}.xlsx`;
  },

  /* Devuelve { file, blob, name, counts } */
  async run() {
    return Lock.run('Exportar Excel', async () => {
      const data = await Exporter.collect();
      const { sheets, counts } = Exporter.buildSheets(data, U.uid('B'), U.localISO());
      const blob = await Xlsx.build(sheets);
      if (!blob || !blob.size) throw new Error('No se pudo generar el archivo Excel.');
      const name = await Exporter.nextName();
      const file = new File([blob], name, { type: XLSX_MIME, lastModified: Date.now() });
      return { file, blob, name, counts, size: blob.size };
    });
  },

  async markDelivered() {
    const at = U.localISO();
    await Meta.set('ultimaCopia', at);
    S.ultimaCopia = at;
  },

  /* Compartir con el menú nativo de Android (Web Share API con archivos) */
  supportsShare(file) {
    try { return !!(navigator.share && navigator.canShare && navigator.canShare({ files: [file] })); } catch (e) { return false; }
  },
  async share(file) {
    if (!Exporter.supportsShare(file)) return { status: 'unsupported' };
    try { await navigator.share({ files: [file], title: file.name }); return { status: 'shared' }; }
    catch (e) {
      if (e && e.name === 'AbortError') return { status: 'cancelled' };
      return { status: 'error', error: e };
    }
  },
  download(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 60000);
  }
};

/* =====================================================================
   IMPORTACIÓN (vista previa → confirmación → aplicación atómica)
   ===================================================================== */
const Importer = {
  table(sheet, required, label) {
    const hdr = (sheet.rows[0] || []).map(h => U.hkey(h));
    const missing = required.filter(r => !hdr.includes(U.hkey(r)));
    if (missing.length) throw new UserError(`En la hoja ${label} faltan las columnas: ${missing.join(', ')}.`);
    const recs = [];
    for (let r = 1; r < sheet.rows.length; r++) {
      const row = sheet.rows[r] || [];
      if (!row.some(v => v != null && String(v).trim() !== '')) continue;
      const get = k => { const i = hdr.indexOf(U.hkey(k)); return i < 0 ? null : (row[i] === undefined ? null : row[i]); };
      recs.push({ row: r + 1, get });
    }
    return recs;
  },
  str(v) { return v == null ? '' : String(typeof v === 'number' ? v : v).trim(); },
  int(v) { // → {blank} | {ok,n} | {bad}
    if (v == null || String(v).trim() === '') return { blank: true };
    if (typeof v === 'number') return Number.isInteger(v) && v >= 0 && v <= 999999999 ? { ok: true, n: v } : { bad: true };
    const s = String(v).trim();
    return /^\d{1,9}$/.test(s) ? { ok: true, n: parseInt(s, 10) } : { bad: true };
  },
  dateOf(rec, isoKey, dispKey) {
    const a = U.parseDateAny(Importer.str(rec.get(isoKey)) || null);
    return a || U.parseDateAny(rec.get(dispKey));
  },

  async analyze(file) {
    const buf = await file.arrayBuffer();
    const wb = await Xlsx.read(buf);
    const by = {}; wb.sheets.forEach(s => { by[U.sheetKey(s.name)] = s; });
    const names = { grupos: 'GRUPOS', items: 'ITEMS', historialcompleto: 'HISTORIAL COMPLETO' };
    const missing = Object.keys(names).filter(k => !by[k]).map(k => names[k]);
    if (missing.length) throw new UserError('Este archivo no es una copia de seguridad de esta aplicación. Faltan las hojas: ' + missing.join(', ') + '.');

    const errors = [], warnings = [];
    const err = (hoja, fila, msg) => errors.push({ hoja, fila, msg });
    const warn = (msg) => warnings.push(msg);

    /* Configuración */
    const config = {};
    if (by.configuracion) by.configuracion.rows.slice(1).forEach(r => { if (r && r[0] != null) config[U.hkey(r[0])] = r[1] == null ? '' : String(r[1]); });
    else warn('El archivo no tiene hoja CONFIGURACIÓN: no se restaurarán las preferencias.');
    const fv = parseInt(config['formato version'], 10);
    if (config['formato version'] && fv > BACKUP_FORMAT) throw new UserError('Este archivo fue creado con una versión más nueva de la aplicación (formato ' + fv + '). Actualiza la app antes de importarlo.');

    const cur = { grupos: await DB.getAll('grupos'), items: await DB.getAll('items'), historial: await DB.getAll('historial') };
    const curG = new Map(cur.grupos.map(g => [g.id, g])), curI = new Map(cur.items.map(i => [i.id, i])), curH = new Map(cur.historial.map(h => [h.id, h]));
    const now = U.localISO(), today = U.dateKey();

    /* GRUPOS */
    const grupos = [], seenG = new Set();
    Importer.table(by.grupos, ['ID grupo', 'Nombre'], 'GRUPOS').forEach(rec => {
      const id = Importer.str(rec.get('ID grupo'));
      if (!id) return err('GRUPOS', rec.row, 'Falta el ID del grupo.');
      if (seenG.has(id)) return err('GRUPOS', rec.row, 'ID de grupo repetido dentro del archivo.');
      let nombre; try { nombre = V.nombre(Importer.str(rec.get('Nombre')), 'El nombre'); } catch (e) { return err('GRUPOS', rec.row, e.message); }
      let creadoEn = Importer.dateOf(rec, 'Fecha de creación (ISO)', 'Fecha de creación');
      if (!creadoEn) { creadoEn = (curG.get(id) || {}).creadoEn || now; warn(`GRUPOS fila ${rec.row}: fecha de creación ausente o inválida; se usó otra.`); }
      const o = Importer.int(rec.get('Orden'));
      seenG.add(id);
      grupos.push({ id, nombre, icono: V.icono(Importer.str(rec.get('Icono'))), creadoEn, orden: o.ok ? o.n : grupos.length + 1, estado: Importer.str(rec.get('Estado')) || 'activo' });
    });
    const gIds = new Set(grupos.map(g => g.id));
    const gKnown = id => gIds.has(id);

    /* ITEMS */
    const items = [], seenI = new Set();
    const hasP = (by.items.rows[0] || []).some(h => U.hkey(h) === U.hkey('Pedir cantidad faltante')); /* copias antiguas no traen el estado de pedidos */
    Importer.table(by.items, ['ID ítem', 'ID grupo', 'Descripción', 'Cantidad esperada'], 'ITEMS').forEach(rec => {
      const id = Importer.str(rec.get('ID ítem')), gid = Importer.str(rec.get('ID grupo'));
      if (!id) return err('ITEMS', rec.row, 'Falta el ID del ítem.');
      if (seenI.has(id)) return err('ITEMS', rec.row, 'ID de ítem repetido dentro del archivo.');
      if (!gid || !gKnown(gid)) return err('ITEMS', rec.row, 'El grupo del ítem no existe (ID ' + (gid || 'vacío') + ').');
      let descripcion; try { descripcion = V.nombre(Importer.str(rec.get('Descripción')), 'La descripción'); } catch (e) { return err('ITEMS', rec.row, e.message); }
      const esp = Importer.int(rec.get('Cantidad esperada'));
      if (!esp.ok) return err('ITEMS', rec.row, 'La cantidad esperada debe ser un entero mayor o igual a 0.');
      const rl = Importer.int(rec.get('Cantidad real vigente'));
      const fq = Importer.int(rec.get('Frecuencia de control (días)'));
      let frecuenciaDias = FREQ_DEFAULT;
      if (fq.ok && FREQS.includes(fq.n)) frecuenciaDias = fq.n;
      else if (!fq.blank) warn(`ITEMS fila ${rec.row}: frecuencia de control no válida; se usó ${FREQ_DEFAULT} días.`);
      if (rl.bad) return err('ITEMS', rec.row, 'La cantidad real vigente debe ser un entero mayor o igual a 0 (o vacía).');
      let ultimo = Importer.dateOf(rec, 'Último control (ISO)', 'Último control');
      let vence = Importer.dateOf(rec, 'Próximo vencimiento (ISO)', 'Próximo vencimiento'); vence = vence ? vence.slice(0, 10) : null;
      let real = rl.ok ? rl.n : null;
      if (real != null && !ultimo) { warn(`ITEMS fila ${rec.row}: tiene cantidad vigente sin fecha de control; se importó como pendiente.`); real = null; vence = null; }
      if (real != null && !vence) { vence = U.addDays(ultimo.slice(0, 10), frecuenciaDias); warn(`ITEMS fila ${rec.row}: faltaba el vencimiento; se calculó según la frecuencia del ítem.`); }
      const o = Importer.int(rec.get('Orden'));
      const pf = Importer.int(rec.get('Pedir cantidad faltante')), pq = Importer.int(rec.get('Pedido cantidad solicitada'));
      const pd = Importer.dateOf(rec, 'Pedir desde (ISO)', 'Pedir desde'), pe = Importer.dateOf(rec, 'Pedido realizado el (ISO)', 'Pedido realizado el');
      seenI.add(id);
      items.push({
        id, grupoId: gid, descripcion, codigo: V.texto(Importer.str(rec.get('Código')), 60), posicion: V.texto(Importer.str(rec.get('Posición')), 120),
        esperada: esp.n, frecuenciaDias, real, ultimoControl: ultimo || null, venceEl: vence,
        creadoEn: Importer.str(rec.get('Fecha de creación (ISO)')) ? (U.parseDateAny(Importer.str(rec.get('Fecha de creación (ISO)'))) || now) : ((curI.get(id) || {}).creadoEn || now),
        modificadoEn: now, orden: o.ok ? o.n : items.length + 1,
        pedir: hasP ? (pf.ok && pf.n > 0 ? { faltan: pf.n, desde: pd || ultimo || now } : null) : undefined, pedidoEn: pe || null, pedidoFaltan: pq.ok ? pq.n : null
      });
    });
    const iIds = new Set(items.map(i => i.id));
    const iKnown = id => iIds.has(id);

    /* HISTORIAL */
    const historial = [], seenH = new Set();
    Importer.table(by.historialcompleto, ['ID histórico', 'ID ítem', 'ID grupo', 'Cantidad real'], 'HISTORIAL COMPLETO').forEach(rec => {
      const id = Importer.str(rec.get('ID histórico')), itemId = Importer.str(rec.get('ID ítem'));
      if (!id) return err('HISTORIAL', rec.row, 'Falta el ID histórico.');
      if (seenH.has(id)) return err('HISTORIAL', rec.row, 'ID histórico repetido dentro del archivo.');
      if (!itemId || !iKnown(itemId)) return err('HISTORIAL', rec.row, 'El ítem del registro no existe (ID ' + (itemId || 'vacío') + ').');
      const real = Importer.int(rec.get('Cantidad real'));
      if (!real.ok) return err('HISTORIAL', rec.row, 'La cantidad real registrada debe ser un entero mayor o igual a 0.');
      const esp = Importer.int(rec.get('Cantidad esperada (al momento)'));
      if (!esp.ok) return err('HISTORIAL', rec.row, 'La cantidad esperada del momento no es válida.');
      const controlAt = Importer.dateOf(rec, 'Fecha y hora del control (ISO)', 'Fecha y hora del control');
      if (!controlAt) return err('HISTORIAL', rec.row, 'La fecha y hora del control no es válida.');
      let vence = Importer.dateOf(rec, 'Vencimiento (ISO)', 'Vencimiento'); vence = vence ? vence.slice(0, 10) : U.addDays(controlAt.slice(0, 10), FREQ_DEFAULT);
      seenH.add(id);
      historial.push({
        id, itemId, grupoId: Importer.str(rec.get('ID grupo')), grupoNombre: Importer.str(rec.get('Grupo (al momento)')),
        descripcion: Importer.str(rec.get('Descripción (al momento)')), codigo: Importer.str(rec.get('Código (al momento)')), posicion: Importer.str(rec.get('Posición (al momento)')),
        esperada: esp.n, real: real.n, diferencia: real.n - esp.n, controlAt, venceEl: vence
      });
    });

    /* METAS DIARIAS (opcional: copias antiguas no la traen y entonces se conserva el histórico actual) */
    let metas = null;
    if (by.metasdiarias) {
      metas = { dias: {} };
      Importer.table(by.metasdiarias, ['Fecha (ISO)', 'Tipo', 'Cumplida'], 'METAS DIARIAS').forEach(rec => {
        const f = Importer.dateOf(rec, 'Fecha (ISO)', 'Fecha');
        if (!f) return err('METAS', rec.row, 'La fecha de la meta no es válida.');
        const k = f.slice(0, 10), tipo = Importer.str(rec.get('Tipo')).toUpperCase(), h = U.norm(Importer.str(rec.get('Cumplida'))) === 'si';
        const at = Importer.dateOf(rec, 'Cumplida en (ISO)', 'Cumplida en') || null;
        const d = metas.dias[k] = metas.dias[k] || { it: [], ex: null };
        if (tipo === 'EXTRA') d.ex = { h, at };
        else if (tipo === 'ITEM') {
          const id = Importer.str(rec.get('ID ítem')); if (!id) return err('METAS', rec.row, 'Falta el ID del ítem de la meta.');
          d.it.push({ id, d: Importer.str(rec.get('Descripción (al momento)')), g: Importer.str(rec.get('Grupo (al momento)')), h, at, p: Importer.int(rec.get('Prioridad')).n, m: Importer.str(rec.get('Motivo')) || undefined });
        } else err('METAS', rec.row, 'Tipo de meta desconocido (debe ser ITEM o EXTRA).');
      });
    } else warn('El archivo no tiene hoja METAS DIARIAS: se conserva el histórico de metas actual.');

    /* METAS PERSONALIZADAS (opcional: copias antiguas no la traen y entonces se conservan las actuales) */
    let custom = null;
    if (by.metaspersonalizadas) {
      custom = { list: [], done: {} };
      const seenC = new Set();
      Importer.table(by.metaspersonalizadas, ['ID meta', 'Nombre'], 'METAS PERSONALIZADAS').forEach(rec => {
        const id = Importer.str(rec.get('ID meta'));
        if (!id) return err('METAS PERS.', rec.row, 'Falta el ID de la meta.');
        if (seenC.has(id)) return err('METAS PERS.', rec.row, 'ID de meta repetido dentro del archivo.');
        let nombre; try { nombre = V.nombre(Importer.str(rec.get('Nombre')), 'El nombre de la meta'); } catch (e) { return err('METAS PERS.', rec.row, e.message); }
        const cd = Importer.int(rec.get('Cada (días)'));
        let cada = 1;
        if (cd.ok && cd.n >= 1 && cd.n <= 365) cada = cd.n;
        else if (!cd.blank) return err('METAS PERS.', rec.row, 'Cada (días) debe ser un entero de 1 a 365 (1 = todos los días).');
        let inicio = Importer.dateOf(rec, 'Empieza (ISO)', 'Empieza'); inicio = inicio ? inicio.slice(0, 10) : null;
        if (!inicio) { inicio = today; warn(`METAS PERSONALIZADAS fila ${rec.row}: fecha de inicio ausente o inválida; se usó hoy.`); }
        const o = Importer.int(rec.get('Orden'));
        seenC.add(id);
        custom.list.push({ id, nombre, nota: V.texto(Importer.str(rec.get('Nota')), 200), cada, inicio, creadoEn: Importer.dateOf(rec, 'Creada (ISO)', 'Creada') || now, orden: o.ok ? o.n : custom.list.length + 1 });
      });
      if (by.cumplidaspersonalizadas) {
        Importer.table(by.cumplidaspersonalizadas, ['ID meta', 'Fecha de la meta (ISO)'], 'CUMPLIDAS PERSONALIZADAS').forEach(rec => {
          const id = Importer.str(rec.get('ID meta'));
          if (!seenC.has(id)) return err('CUMPLIDAS PERS.', rec.row, 'La meta del registro no existe (ID ' + (id || 'vacío') + ').');
          const f = Importer.dateOf(rec, 'Fecha de la meta (ISO)', 'Fecha de la meta');
          if (!f) return err('CUMPLIDAS PERS.', rec.row, 'La fecha de la meta no es válida.');
          const at = Importer.dateOf(rec, 'Cumplida en (ISO)', 'Cumplida en') || (f.slice(0, 10) + 'T00:00:00.000');
          custom.done[f.slice(0, 10) + '|' + id] = at;
        });
      }
    } else warn('El archivo no tiene hoja METAS PERSONALIZADAS: se conservan las metas personalizadas actuales.');

    /* Contraste con la configuración del archivo */
    const decl = (k, n, label) => { if (config[k] !== undefined && config[k] !== '' && parseInt(config[k], 10) !== n) warn(`El archivo declara ${config[k]} ${label} pero se leyeron ${n} válidos.`); };
    decl('total grupos', grupos.length, 'grupos'); decl('total items', items.length, 'ítems'); decl('total historial', historial.length, 'registros históricos');

    /* Conteos para la vista previa */
    const counts = { grupos: grupos.length, items: items.length, historial: historial.length, custom: custom ? custom.list.length : null };
    const prefs = {};
    if (config.tema === 'dia' || config.tema === 'noche') prefs.tema = config.tema;
    if (['pequeno', 'mediano', 'grande'].includes(config['tamano fuente'])) prefs.fuente = config['tamano fuente'];
    if (config['metas diarias cantidad'] != null && /^\d{1,2}$/.test(String(config['metas diarias cantidad']).trim())) prefs.metasDia = Prefs.nMetas(config['metas diarias cantidad']);

    return {
      fileName: file.name, counts, errors, warnings, prefs,
      current: { grupos: cur.grupos.length, items: cur.items.length, historial: cur.historial.length },
      model: { grupos, items, historial, metas, custom }, today
    };
  },

  async snapshotTemp() {
    const snap = { creadoEn: U.localISO(), grupos: await DB.getAll('grupos'), items: await DB.getAll('items'), historial: await DB.getAll('historial') };
    await Meta.set('tempBackup', snap);
  },

  async apply(prev) {
    const { model, prefs } = prev;
    await Lock.run('Restauración completa', async () => {
      await Importer.snapshotTemp(); // copia temporal del inventario actual
      await DB.tx(['grupos', 'items', 'historial', 'meta'], 'readwrite', t => {
        const g = t.objectStore('grupos'), i = t.objectStore('items'), h = t.objectStore('historial');
        g.clear(); i.clear(); h.clear();
        model.grupos.forEach(x => g.put(x)); model.items.forEach(x => i.put(x)); model.historial.forEach(x => h.put(x));
        if (model.metas) t.objectStore('meta').put({ key: 'metas', value: model.metas });
        if (model.custom) t.objectStore('meta').put({ key: 'metasCustom', value: model.custom });
        if (prefs.tema || prefs.fuente || prefs.metasDia) t.objectStore('meta').put({ key: 'prefs', value: Object.assign({}, S.prefs, prefs) });
        [[g, model.grupos.length, 'grupos'], [i, model.items.length, 'ítems'], [h, model.historial.length, 'historial']].forEach(([st, n, label]) => {
          const c = st.count();
          c.onsuccess = t.g(() => { if (c.result !== n) throw new Error('Verificación fallida en ' + label + ': se esperaban ' + n + ' y hay ' + c.result + '. Se revirtió todo.'); });
        });
      });
      if (prefs.tema || prefs.fuente || prefs.metasDia) { S.prefs = Object.assign({}, S.prefs, prefs); Prefs.apply(); }
      if (model.metas) Metas.data = model.metas;
      if (model.custom) CustomGoals.data = model.custom;
    });
    await Repo.load();
    await Repo.seedPedidos();
    await Analytics.load();
    await Repo.sweepExpired();
  }
};

/* ---------- Capas (hojas, diálogos, buscador) con soporte del botón Atrás ---------- */
const Layer = {
  stack: [], hasEntry: false, ignore: false, pending: null,
  open(node, onClose) {
    const h = { node, onClose, closed: false }; node._h = h;
    if (!Layer.hasEntry) { history.pushState({ layer: 1 }, ''); Layer.hasEntry = true; }
    Layer.stack.push(h); $('#layer').appendChild(node); document.body.classList.add('noscroll');
    return h;
  },
  close(h, fromPop, noRelease) {
    if (!h || h.closed) return;
    h.closed = true;
    const i = Layer.stack.indexOf(h); if (i >= 0) Layer.stack.splice(i, 1);
    h.node.remove();
    try { if (h.onClose) h.onClose(); } catch (e) { console.error(e); }
    if (!Layer.stack.length) {
      document.body.classList.remove('noscroll');
      if (!fromPop && !noRelease) setTimeout(Layer.release, 0);
    }
  },
  release() {
    if (Layer.stack.length || !Layer.hasEntry || Layer.ignore) return;
    Layer.ignore = true; Layer.hasEntry = false; history.back();
  },
  closeTop() { Layer.close(Layer.stack[Layer.stack.length - 1]); },
  /* Cierra todo y ejecuta fn cuando el historial ya está estable */
  closeAllThen(fn) {
    Layer.stack.slice().forEach(h => Layer.close(h, false, true));
    if (Layer.hasEntry || Layer.ignore) {
      Layer.pending = fn;
      if (!Layer.ignore) { Layer.ignore = true; Layer.hasEntry = false; history.back(); }
    } else fn();
  },
  onPop() { // devuelve true si el evento fue consumido por las capas
    if (Layer.ignore) { Layer.ignore = false; const f = Layer.pending; Layer.pending = null; if (f) f(); return true; }
    if (Layer.stack.length) {
      Layer.hasEntry = false;
      Layer.close(Layer.stack[Layer.stack.length - 1], true);
      if (Layer.stack.length) { history.pushState({ layer: 1 }, ''); Layer.hasEntry = true; }
      return true;
    }
    return false;
  }
};

function pieSvg(sl) {
  const tot = sl.reduce((a, x) => a + x[0], 0); let a0 = -Math.PI / 2, out = '';
  const pt = a => `${(60 + 54 * Math.cos(a)).toFixed(2)} ${(60 + 54 * Math.sin(a)).toFixed(2)}`;
  sl.forEach(([v, c]) => {
    if (!v) return;
    if (v === tot) { out += `<circle cx="60" cy="60" r="54" style="fill:${c}"/>`; return; }
    const a1 = a0 + 2 * Math.PI * v / tot;
    out += `<path d="M60 60 L${pt(a0)} A54 54 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${pt(a1)} Z" style="fill:${c}" stroke="var(--surf)" stroke-width="2"/>`; a0 = a1;
  });
  return `<svg class="pie" viewBox="0 0 120 120" role="img" aria-label="Cumplimiento de metas del mes">${out}</svg>`;
}

/* ---------- Gráfico de evolución del stock de un ítem ---------- */
const StockChart = {
  tms(iso) { return new Date(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10), +iso.slice(11, 13) || 0, +iso.slice(14, 16) || 0, +iso.slice(17, 19) || 0).getTime(); },
  nice(max) {
    const raw = Math.max(1, max) / 4, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
    const step = Math.max(1, (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p);
    return { step, max: step * Math.max(1, Math.ceil(Math.max(1, max) / step)) };
  },
  /* pts: registros del historial, de más antiguo a más reciente */
  svg(pts) {
    const W = 340, H = 205, L = 40, R = 14, T = 16, B = 30, iw = W - L - R, ih = H - T - B, PAD = 9;
    const n = pts.length;
    const ns = StockChart.nice(Math.max(...pts.map(p => p.real), ...pts.map(p => p.esperada)));
    const t0 = StockChart.tms(pts[0].controlAt), t1 = StockChart.tms(pts[n - 1].controlAt), span = t1 - t0;
    const useTime = n > 1 && span > 0;
    const fx = i => n === 1 ? L + iw / 2 : useTime ? L + PAD + (StockChart.tms(pts[i].controlAt) - t0) / span * (iw - 2 * PAD) : L + PAD + i / (n - 1) * (iw - 2 * PAD);
    const fy = v => T + ih - v / ns.max * ih;
    const xs = pts.map((_, i) => fx(i));
    let g = '';
    for (let v = 0; v <= ns.max + 1e-9; v += ns.step) {
      g += `<line class="cg" x1="${L}" x2="${W - R}" y1="${fy(v).toFixed(1)}" y2="${fy(v).toFixed(1)}"/><text class="ct" x="${L - 6}" y="${(fy(v) + 3.5).toFixed(1)}" text-anchor="end">${v}</text>`;
    }
    const d2 = k => String(k).padStart(2, '0');
    const lab = ms => {
      const d = new Date(ms), dm = d2(d.getDate()) + '/' + d2(d.getMonth() + 1);
      if (span < 86400000 * 1.5) return dm + ' ' + d2(d.getHours()) + ':' + d2(d.getMinutes());
      if (span > 86400000 * 330) return dm + '/' + String(d.getFullYear()).slice(2);
      return dm;
    };
    let xt = '';
    if (!useTime) {
      xt = `<text class="ct" x="${(L + iw / 2).toFixed(1)}" y="${H - 9}" text-anchor="middle">${lab(t0)}</text>`;
    } else {
      const m = Math.min(3, n - 1);
      for (let k = 0; k <= m; k++) {
        const fr = k / m, x = L + PAD + fr * (iw - 2 * PAD);
        xt += `<text class="ct" x="${x.toFixed(1)}" y="${H - 9}" text-anchor="${k === 0 ? 'start' : k === m ? 'end' : 'middle'}">${lab(t0 + fr * span)}</text>`;
      }
    }
    /* Esperada: escalonada (cambia si se editó la cantidad esperada del ítem) */
    let ep = `M${(n === 1 ? xs[0] - 16 : xs[0]).toFixed(1)} ${fy(pts[0].esperada).toFixed(1)}`;
    if (n === 1) ep += ` H${(xs[0] + 16).toFixed(1)}`;
    for (let i = 1; i < n; i++) ep += ` H${xs[i].toFixed(1)} V${fy(pts[i].esperada).toFixed(1)}`;
    const line = n > 1 ? `<polyline class="cl" points="${pts.map((p, i) => xs[i].toFixed(1) + ',' + fy(p.real).toFixed(1)).join(' ')}"/>` : '';
    const dots = pts.map((p, i) => `<circle class="cpt${p.real < p.esperada ? ' n' : ''}" data-i="${i}" cx="${xs[i].toFixed(1)}" cy="${fy(p.real).toFixed(1)}" r="4.5"/>`).join('');
    const vals = n <= 8 ? pts.map((p, i) => `<text class="cv" x="${xs[i].toFixed(1)}" y="${(fy(p.real) - 10).toFixed(1)}" text-anchor="middle">${p.real}</text>`).join('') : '';
    const hits = pts.map((p, i) => `<circle class="chit" data-act="chart-pt" data-i="${i}" cx="${xs[i].toFixed(1)}" cy="${fy(p.real).toFixed(1)}" r="15"><title>${U.fmtDateTime(p.controlAt)}: ${p.real}</title></circle>`).join('');
    return `<svg class="chartsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de la evolución del stock real: ${n} ${U.plural(n, 'control', 'controles')}">${g}${xt}<path class="ce" d="${ep}"/>${line}${dots}${vals}${hits}</svg>
      <div class="cleg"><span><i></i>Real encontrada</span><span><i class="d"></i>Esperada</span></div>`;
  },
  select(i) {
    const r = UI.chartPts && UI.chartPts[i]; if (!r) return;
    document.querySelectorAll('#histChart .cpt').forEach(c => { const on = +c.dataset.i === i; c.classList.toggle('sel', on); c.setAttribute('r', on ? '7' : '4.5'); });
    const box = $('#chartInfo'); if (!box) return;
    box.hidden = false;
    box.innerHTML = `<b>${U.fmtDateTime(r.controlAt)}</b> · Real <b>${r.real}</b> · Esperada ${r.esperada}<br>${Status.diffText(r.esperada, r.real)}`;
  }
};
function renderStockChart(asc) {
  const box = $('#histChart'); if (!box) return;
  UI.chartPts = asc;
  box.innerHTML = StockChart.svg(asc);

function render() {
  const app = $('#app'); const old = app.querySelector('.main');
  const key = UI.view + '|' + UI.gid + '|' + UI.iid; const sc = old && UI.lastKey === key ? old.scrollTop : 0;
  let html;
  if (!S.dbOk) html = viewFatal();
  else if (UI.view === 'group' && Repo.group(UI.gid)) html = viewGroup();
  else if (UI.view === 'history' && Repo.item(UI.iid)) html = viewHistory();
  else if (UI.view === 'indicadores') html = viewIndicadores();
  else if (UI.view === 'pedidos') html = viewPedidos();
  else if (UI.view === 'metas') html = viewMetas();
  else if (UI.view === 'metasadmin') html = viewMetasAdmin();
  else if (UI.view === 'options') html = viewOptions();
  else { UI.view = 'home'; html = viewHome(); }
  app.innerHTML = html; UI.lastKey = UI.view + '|' + UI.gid + '|' + UI.iid;
  const m = app.querySelector('.main'); if (m) m.scrollTop = sc;
  if (UI.view === 'history') loadHistory().catch(fail);
  if (UI.highlight) {
    const el = $(`[data-item="${UI.highlight}"]`);
    if (el) { el.scrollIntoView({ block: 'center' }); el.classList.add('hl'); setTimeout(() => el.classList.remove('hl'), 2800); }
    UI.highlight = null;
  }
}

  const n = document.createElement('div'); n.className = 'ov full';
  n.innerHTML = `<div class="sheet"><div class="shd"><button class="ib" data-act="layer-close" aria-label="Cerrar búsqueda">${ICON.back}</button>
    <input id="q" type="search" placeholder="Buscar por descripción o código" autocomplete="off" aria-label="Buscar"></div><div id="res" class="sres"><p class="hint">Escribe para buscar en todos los grupos.</p></div></div>`;
  Layer.open(n);
  const inp = n.querySelector('#q'); inp.focus();
  inp.addEventListener('input', () => {
    const q = inp.value.trim(), box = n.querySelector('#res');
    if (!q) { box.innerHTML = '<p class="hint">Escribe para buscar en todos los grupos.</p>'; return; }
    const r = Search.run(q);
    box.innerHTML = r.length ? r.map(({ it, g, st }) => `<button class="sr" data-act="search-go" data-id="${it.id}"><span class="srt">${ESC(it.descripcion)}</span>
      <span class="srm">${it.codigo ? 'Código: ' + ESC(it.codigo) + ' · ' : ''}${ESC(g.icono)} ${ESC(g.nombre)}</span><span class="srm">${ICON.pin}${it.posicion ? ESC(it.posicion) : 'Sin posición'}</span>
      <span class="chip s-${st}">${Status.label[st]}</span></button>`).join('') : '<p class="hint">No se encontraron resultados</p>';
  });
}

/* ---------- Excel: exportar / importar ---------- */
async function doExport() {
  const e = await Exporter.run();
  UI.exp = e;
  const c = e.counts, share = Exporter.supportsShare(e.file);
  const n = overlay(`<h3>Excel generado</h3><p class="fn">${ESC(e.name)} · ${Math.max(1, Math.round(e.size / 1024))} KB</p>
    <ul class="sheets"><li>GRUPOS <b>${c.grupos}</b></li><li>ITEMS <b>${c.items}</b></li><li>HISTORIAL COMPLETO <b>${c.historial}</b></li><li>MATRIZ HISTÓRICA <b>${c.items} × ${c.fechas}</b></li><li>METAS PERSONALIZADAS <b>${c.metasPers}</b></li><li>CONFIGURACIÓN <b>1</b></li></ul>
    <div id="expStatus" class="stat info"><b>Último paso</b><span>Elige cómo guardar o enviar el archivo.${share ? '' : ' Este navegador no permite compartir archivos directamente: usa «Descargar Excel».'}</span></div>
    <button class="btn primary big block" data-act="exp-share">${ICON.share} Compartir por Android</button>
    <button class="btn outline block" data-act="exp-dl">${ICON.down} Descargar Excel</button>
    <button class="btn outline block" data-act="exp-open">${ICON.folder} Abrir carpeta de descargas</button>
    <button class="btn ghost block" data-act="layer-close">Cerrar</button>`);
  Layer.open(n, () => { UI.exp = null; });
}
function expStatus(kind, title, text) { const el = $('#expStatus'); if (el) { el.className = 'stat ' + kind; el.innerHTML = `<b>${title}</b><span>${ESC(text)}</span>`; } }
async function expShare() {
  const e = UI.exp; if (!e) return;
  const r = await Exporter.share(e.file);
  if (r.status === 'shared') { await Exporter.markDelivered(); expStatus('ok', 'EXPORTACIÓN COMPLETADA', 'Android abrió el menú de compartir y confirmó la acción. Comprueba en WhatsApp que el documento se envió.'); }
  else if (r.status === 'cancelled') expStatus('warn', 'Envío cancelado', 'El archivo ya fue generado correctamente. Puedes compartirlo otra vez o descargarlo.');
  else if (r.status === 'unsupported') expStatus('warn', 'Compartir no disponible', 'Este navegador no permite compartir archivos. Usa «Descargar Excel» y envíalo luego desde la app Archivos de Android.');
  else expStatus('bad', 'No se pudo abrir el menú de compartir', (r.error && r.error.message ? r.error.message + ' ' : '') + 'El archivo está generado: usa «Descargar Excel».');
}
async function expDownload() {
  const e = UI.exp; if (!e) return;
  Exporter.download(e.blob, e.name);
  await Exporter.markDelivered();
  try { await Metas.onDownload(); render(); } catch (err) { console.error(err); }
  expStatus('ok', 'EXPORTACIÓN COMPLETADA', 'Se inició la descarga de ' + e.name + '. Búscala en la carpeta Descargas (toca «Abrir carpeta de descargas») o en la notificación de Chrome.');
}

/* Abrir la carpeta de descargas. Un sitio web no puede abrir carpetas por sí mismo; se prueba, en orden:
   1) la pantalla "Descargas" del sistema Android (intent estándar VIEW_DOWNLOADS, presente en AOSP, Samsung, Xiaomi, Motorola, etc.);
   2) si el teléfono no responde, el explorador de archivos del sistema (selector nativo), que siempre muestra Descargas. */
const DL_INTENT = 'intent:#Intent;action=android.intent.action.VIEW_DOWNLOADS;end';
async function openDownloads() {
  const e = UI.exp;
  let left = false;
  const onHide = () => { if (document.hidden) left = true; };
  document.addEventListener('visibilitychange', onHide); window.addEventListener('pagehide', onHide);
  try {
    const a = document.createElement('a'); a.href = DL_INTENT; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();
    await new Promise(r => setTimeout(r, 1400)); // si Android abrió otra pantalla, la página pasa a segundo plano
  } finally { document.removeEventListener('visibilitychange', onHide); window.removeEventListener('pagehide', onHide); }
  const name = e ? e.name : 'Backup_Inventario_…xlsx';
  if (left) { expStatus('ok', 'Carpeta de descargas abierta', 'Busca el archivo ' + name + ' (si lo acabas de descargar, aparece primero).'); return; }
  expStatus('warn', 'Se abrirá el explorador de archivos', 'Entra en «Descargas» y busca ' + name + '. Solo sirve para ver dónde está: no se importa nada.');
  const inp = $('#fdl'); if (inp) { inp.value = ''; inp.click(); }
}
$('#fdl').addEventListener('change', () => { const i = $('#fdl'); i.value = ''; toast('No se importó nada. Para importar un Excel usa Opciones → Importar Excel.'); });

function pickFile() {
  Lock.free();
  if (UI.importing) throw new UserError('Ya hay una importación en curso.');
  const inp = $('#fpick'); inp.value = '';
  inp.onchange = async () => { const f = inp.files && inp.files[0]; inp.value = ''; if (f) await analyzeImport(f).catch(fail); };
  inp.click();
}
async function analyzeImport(f) {
  if (!/\.xlsx$/i.test(f.name)) throw new UserError('Selecciona un archivo con extensión .xlsx.');
  UI.importing = true; showBusy('Analizando archivo…');
  let prev;
  try { prev = await Importer.analyze(f); } catch (e) { UI.importing = false; hideBusy(); throw e; }
  hideBusy();
  const c = prev.counts, m = prev.model;
  const nothing = !m.grupos.length && !m.items.length && !m.historial.length;
  const errList = prev.errors.slice(0, 6).map(x => `<li>${ESC(x.hoja)} fila ${x.fila}: ${ESC(x.msg)}</li>`).join('');
  const n = overlay(`<h3>Importar Excel</h3><p class="fn">${ESC(prev.fileName)}</p>
    <div class="vp"><h4>Contenido del archivo (no se modificó nada todavía)</h4>
    <table><tr><td>Grupos</td><td>${c.grupos}</td></tr><tr><td>Ítems</td><td>${c.items}</td></tr><tr><td>Registros históricos</td><td>${c.historial}</td></tr>${c.custom != null ? `<tr><td>Metas personalizadas</td><td>${c.custom}</td></tr>` : ''}</table></div>
    <div class="stat bad"><b>Se reemplazará todo el inventario actual</b><span>Hoy hay ${prev.current.grupos} grupos, ${prev.current.items} ítems y ${prev.current.historial} registros históricos. Se guardará una copia temporal interna antes de reemplazar y, si algo falla, se revierte todo.</span></div>
    ${prev.errors.length ? `<div class="stat bad"><b>${prev.errors.length} registro(s) no se pueden importar</b><ul class="el">${errList}</ul>${prev.errors.length > 6 ? `<span>…y ${prev.errors.length - 6} más.</span>` : ''}</div>` : ''}
    ${prev.warnings.length ? `<div class="stat warn"><b>Avisos</b><ul class="el">${prev.warnings.slice(0, 4).map(w => `<li>${ESC(w)}</li>`).join('')}</ul>${prev.warnings.length > 4 ? `<span>…y ${prev.warnings.length - 4} más.</span>` : ''}</div>` : ''}
    ${nothing ? '<div class="stat bad"><b>No hay datos válidos para importar.</b></div>' : '<label class="chk"><input type="checkbox" data-gate> Entiendo que se reemplazará todo el inventario actual.</label>'}
    <div class="btnrow"><button class="btn danger" data-act="imp-apply" disabled ${nothing ? '' : 'data-gated'}>Importar y reemplazar</button><button class="btn ghost" data-act="layer-close">Cancelar</button></div>`);
  n._prev = prev;
  Layer.open(n, () => { UI.importing = false; });
}
async function applyImport(ov) {
  const prev = ov._prev; Layer.close(ov._h);
  UI.importing = true;
  try {
    await Importer.apply(prev);
    UI.drafts = {}; UI.view = 'home'; UI.gid = UI.iid = null; history.replaceState({ v: 'home' }, ''); render();
    const n = overlay(`<h3>Importación completada</h3><p>Se importaron ${prev.model.grupos.length} grupos, ${prev.model.items.length} ítems y ${prev.model.historial.length} registros históricos.</p>
      <div class="btnrow"><button class="btn primary" data-act="layer-close">Aceptar</button></div>`, 'center');
    Layer.open(n);
  } catch (e) {
    console.error(e);
    toast('La importación falló y se revirtió: ' + (e.message || e) + ' Tu inventario anterior sigue intacto.', 'bad');
  } finally { UI.importing = false; }
}

/* ---------- Recordatorio del día 16 (no bloquea la aplicación) ---------- */
const Reminder = {
  confirmedMonth: null, nextAt: 0, visible: false,
  async load() { const r = await Meta.get('recordatorio'); this.confirmedMonth = r && r.confirmedMonth ? r.confirmedMonth : null; },
  due(now = new Date()) { return now.getDate() === 16 && this.confirmedMonth !== U.monthKey(now); },
  check() {
    if (!S.dbOk) return;
    if (!this.due()) { if (this.visible) this.hide(); return; }
    if (this.visible) return;
    if (Date.now() >= this.nextAt) this.show();
  },
  show() { $('#remPw').value = ''; $('#remErr').hidden = true; $('#reminder').hidden = false; this.visible = true; },
  hide() { $('#reminder').hidden = true; this.visible = false; },
  close() { this.nextAt = Date.now() + 60000; this.hide(); },
  async confirm() {
    if ($('#remPw').value !== 'fb') { $('#remErr').hidden = false; return; }
    const mk = U.monthKey();
    try {
      await Meta.set('recordatorio', { confirmedMonth: mk, confirmadoEn: U.localISO() });
      this.confirmedMonth = mk; this.hide(); toast('Recordatorio confirmado hasta el próximo día 16');
    } catch (e) { fail(e); }
  }
};

/* Evita que el toque largo (o el clic posterior) active acciones no deseadas */
document.addEventListener('click', e => { if (Date.now() < LP.guard) { e.preventDefault(); e.stopImmediatePropagation(); } }, true);
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = A[el.dataset.act]; if (!f) return;
  Promise.resolve().then(() => f(el, e)).catch(fail);
});
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-lp]');
  if (!el || e.target.closest('input,button,textarea,a,label') || (e.pointerType === 'mouse' && e.button !== 0)) return;
  LP.sx = e.clientX; LP.sy = e.clientY; clearTimeout(LP.timer);
  LP.timer = setTimeout(() => {
    LP.guard = Date.now() + 700; if (navigator.vibrate) { try { navigator.vibrate(25); } catch (_) { } }
    openContext(el.dataset.lp, el.dataset.id);
  }, 900);
});
const cancelLP = () => clearTimeout(LP.timer);
document.addEventListener('pointermove', e => { if (Math.abs(e.clientX - LP.sx) > 10 || Math.abs(e.clientY - LP.sy) > 10) cancelLP(); });
['pointerup', 'pointercancel', 'pointerleave', 'dragstart'].forEach(t => document.addEventListener(t, cancelLP));
document.addEventListener('scroll', cancelLP, true);
/* Con el teclado abierto, el toque en Guardar/✓ puede perderse porque el diseño se mueve al cerrarse el teclado.
   Se procesa en touchend (antes del cambio de foco) y se evita el clic fantasma. */
const TP = { x: 0, y: 0 };
document.addEventListener('touchstart', e => { const t = e.touches[0]; if (t) { TP.x = t.clientX; TP.y = t.clientY; } }, { passive: true });
document.addEventListener('touchend', e => {
  const b = e.target.closest && e.target.closest('.okb, form [type=submit]');
  if (!b || b.disabled || b.hidden) return;
  const t = e.changedTouches[0];
  if (t && (Math.abs(t.clientX - TP.x) > 10 || Math.abs(t.clientY - TP.y) > 10)) return;
  e.preventDefault(); b.click();
}, { passive: false });
document.addEventListener('contextmenu', e => { if (e.target.closest('[data-lp]')) e.preventDefault(); });

document.addEventListener('input', e => {
  const t = e.target;
  if (t.classList && t.classList.contains('qty')) {
    const c = t.value.replace(/\D/g, '').slice(0, 9); if (c !== t.value) t.value = c;
    const id = t.dataset.id, it = Repo.item(id); UI.drafts[id] = c;
    const dirty = c !== '' && it && (Status.of(it) !== 'controlado' || c !== String(it.real) || t.dataset.goal);
    t.classList.toggle('dirty', !!dirty);
    const b = t.parentNode.querySelector('.okb'); if (b) b.hidden = !dirty;
  } else if (t.dataset && t.dataset.digits !== undefined) {
    const c = t.value.replace(/\D/g, '').slice(0, 9); if (c !== t.value) t.value = c;
  }
});
document.addEventListener('change', e => {
  if (e.target.matches && e.target.matches('[data-gate]')) e.target.closest('.ov').querySelectorAll('[data-gated]').forEach(b => { b.disabled = !e.target.checked; });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('qty')) { e.preventDefault(); const b = e.target.parentNode.querySelector('.okb'); if (b && !b.hidden) b.click(); }
  if (e.key === 'Enter' && e.target.id === 'remPw') { e.preventDefault(); Reminder.confirm(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.gcard')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('focusin', e => {
  const t = e.target; if (t.matches && t.matches('input:not([type=checkbox]),textarea')) setTimeout(() => { try { t.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (_) { } }, 320);
});

/* ---------- Comprobaciones periódicas (un único temporizador) ---------- */
const Tick = {
  id: null, n: 0,
  start() { if (this.id) return; this.id = setInterval(() => { Reminder.check(); if (++this.n % 30 === 0) sweepAndRender(); }, 1000); }
};
function onResume() { if (document.hidden) return; Reminder.check(); sweepAndRender(); }
document.addEventListener('visibilitychange', onResume);
window.addEventListener('focus', onResume);
window.addEventListener('pageshow', onResume);
window.addEventListener('error', e => { console.error(e.error || e.message); });
window.addEventListener('unhandledrejection', e => { console.error(e.reason); });

/* ---------- Arranque ---------- */
async function boot() {
  try { await DB.open(); await StorageInfo.selfTest(); S.dbOk = true; }
  catch (e) { S.dbOk = false; S.dbError = e && e.message ? e.message : String(e); render(); return; }
  try {
    await Prefs.load(); await Repo.load(); await Repo.seedPedidos(); await Analytics.load(); await Metas.load(); await CustomGoals.load();
    S.ultimaCopia = (await Meta.get('ultimaCopia')) || null;
    await StorageInfo.check();
    await Repo.sweepExpired(); await Reminder.load();
  } catch (e) { S.dbOk = false; S.dbError = e.message || String(e); render(); return; }
  history.replaceState({ v: 'home' }, '');
  render(); Reminder.check(); Tick.start();
  if (S.storage.persisted === false) StorageInfo.request().then(() => { if (!Layer.stack.length) render(); });
}
window.__stock = { Analytics, Pedidos, CustomGoals, U, V, S, DB, Meta, Repo, Stats, Status, Search, Xlsx, Exporter, Importer, Reminder, UI, render, Layer };
boot();

</script>
<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('SW', e); }); });
}
</script>
